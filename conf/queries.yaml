---
# queries.yaml — Custom metrics para postgres-exporter
# Formato: https://github.com/prometheus-community/postgres_exporter#adding-new-metrics-via-a-config-file
#
# Todas as queries acessam apenas catálogo do sistema (pg_stat_*, pg_locks).
# Nenhuma query retorna conteúdo de tabelas de aplicação — ver docs/LGPD.md.

# ── Tamanho por database ──────────────────────────────────────────────────────
pg_database_size:
  query: |
    SELECT datname,
           pg_database_size(datname) AS size_bytes
    FROM pg_database
    WHERE datistemplate = false
  metrics:
    - datname:
        usage: LABEL
        description: "Nome do database"
    - size_bytes:
        usage: GAUGE
        description: "Tamanho do database em bytes"

# ── Top 20 maiores tabelas por tamanho total (tabela + TOAST + índices) ───────
pg_table_size:
  query: |
    SELECT schemaname AS schema,
           tablename  AS table,
           pg_total_relation_size(schemaname || '.' || tablename) AS total_bytes,
           pg_relation_size(schemaname || '.' || tablename)       AS table_bytes,
           pg_indexes_size(schemaname || '.' || tablename)        AS indexes_bytes
    FROM pg_tables
    WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
    ORDER BY pg_total_relation_size(schemaname || '.' || tablename) DESC
    LIMIT 20
  metrics:
    - schema:
        usage: LABEL
        description: "Schema da tabela"
    - table:
        usage: LABEL
        description: "Nome da tabela"
    - total_bytes:
        usage: GAUGE
        description: "Tamanho total (tabela + TOAST + índices) em bytes"
    - table_bytes:
        usage: GAUGE
        description: "Tamanho da tabela (sem índices) em bytes"
    - indexes_bytes:
        usage: GAUGE
        description: "Tamanho dos índices em bytes"

# ── Bloat de índices — candidatos a REINDEX ───────────────────────────────────
# Fórmula simplificada via pg_stat_user_indexes; bloat exato requer pgstattuple.
pg_index_bloat:
  query: |
    SELECT schemaname AS schema,
           indexrelname AS index_name,
           idx_scan,
           CASE
             WHEN idx_scan = 0 THEN 1.0
             ELSE round(
               (pg_relation_size(indexrelid)::numeric /
                NULLIF(pg_relation_size(indrelid), 0)) * 100, 2
             )
           END AS bloat_ratio_pct
    FROM pg_stat_user_indexes
    JOIN pg_index USING (indexrelid)
    WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
      AND NOT indisprimary
    ORDER BY bloat_ratio_pct DESC
    LIMIT 20
  metrics:
    - schema:
        usage: LABEL
        description: "Schema do índice"
    - index_name:
        usage: LABEL
        description: "Nome do índice"
    - idx_scan:
        usage: COUNTER
        description: "Número de scans pelo índice"
    - bloat_ratio_pct:
        usage: GAUGE
        description: "Ratio estimado de bloat do índice (%)"

# ── Top 10 queries por tempo total (pg_stat_statements) ──────────────────────
# Requer extensão pg_stat_statements ativa (já incluída no init do Postgres).
# queryid é normalizado — sem valores literais (LGPD-safe).
pg_stat_statements_top:
  query: |
    SELECT queryid::text AS queryid,
           calls,
           round(total_exec_time::numeric, 2) AS total_exec_time_ms,
           round(mean_exec_time::numeric, 2)  AS mean_exec_time_ms,
           rows
    FROM pg_stat_statements
    ORDER BY total_exec_time DESC
    LIMIT 10
  metrics:
    - queryid:
        usage: LABEL
        description: "ID normalizado da query (sem literais)"
    - calls:
        usage: COUNTER
        description: "Número de execuções"
    - total_exec_time_ms:
        usage: GAUGE
        description: "Tempo total de execução em ms"
    - mean_exec_time_ms:
        usage: GAUGE
        description: "Tempo médio de execução em ms"
    - rows:
        usage: COUNTER
        description: "Total de linhas retornadas/afetadas"

# ── Locks por tipo ────────────────────────────────────────────────────────────
pg_locks_count:
  query: |
    SELECT mode,
           count(*) AS count
    FROM pg_locks
    GROUP BY mode
  metrics:
    - mode:
        usage: LABEL
        description: "Modo do lock (AccessShareLock, RowExclusiveLock, etc.)"
    - count:
        usage: GAUGE
        description: "Número de locks deste tipo"

# ── Conexões por estado ───────────────────────────────────────────────────────
pg_connections_by_state:
  query: |
    SELECT coalesce(state, 'unknown') AS state,
           count(*) AS count
    FROM pg_stat_activity
    GROUP BY state
  metrics:
    - state:
        usage: LABEL
        description: "Estado da conexão (active, idle, idle in transaction, etc.)"
    - count:
        usage: GAUGE
        description: "Número de conexões neste estado"

# ── Queries de longa duração (> 30s) ─────────────────────────────────────────
pg_long_running_queries:
  query: |
    SELECT count(*) AS count
    FROM pg_stat_activity
    WHERE state = 'active'
      AND now() - query_start > interval '30 seconds'
      AND query NOT LIKE '%pg_stat_activity%'
  metrics:
    - count:
        usage: GAUGE
        description: "Número de queries rodando há mais de 30 segundos"

# ── Dead tuples — candidatos a VACUUM ────────────────────────────────────────
pg_dead_tuples:
  query: |
    SELECT schemaname AS schema,
           relname    AS table,
           n_dead_tup,
           n_live_tup,
           CASE
             WHEN (n_live_tup + n_dead_tup) = 0 THEN 0
             ELSE round(
               (n_dead_tup::numeric / (n_live_tup + n_dead_tup)) * 100, 2
             )
           END AS dead_ratio_pct
    FROM pg_stat_user_tables
    WHERE n_dead_tup > 0
    ORDER BY n_dead_tup DESC
    LIMIT 20
  metrics:
    - schema:
        usage: LABEL
        description: "Schema da tabela"
    - table:
        usage: LABEL
        description: "Nome da tabela"
    - n_dead_tup:
        usage: GAUGE
        description: "Número de tuplas mortas"
    - n_live_tup:
        usage: GAUGE
        description: "Número de tuplas vivas"
    - dead_ratio_pct:
        usage: GAUGE
        description: "Percentual de tuplas mortas (candidatos a VACUUM)"

# ── PostGIS: contagem de geometrias por tabela ────────────────────────────────
# Conta tabelas com coluna do tipo geometry (requer PostGIS instalado).
postgis_geometry_count:
  query: |
    SELECT n.nspname AS schema,
           c.relname AS table,
           count(*)  AS geometry_columns
    FROM pg_class c
    JOIN pg_namespace n ON n.oid = c.relnamespace
    JOIN pg_attribute a ON a.attrelid = c.oid
    JOIN pg_type t ON t.oid = a.atttypid
    WHERE t.typname = 'geometry'
      AND c.relkind = 'r'
      AND n.nspname NOT IN ('pg_catalog', 'information_schema', 'topology')
    GROUP BY n.nspname, c.relname
  metrics:
    - schema:
        usage: LABEL
        description: "Schema da tabela"
    - table:
        usage: LABEL
        description: "Nome da tabela com coluna geometry"
    - geometry_columns:
        usage: GAUGE
        description: "Número de colunas geometry na tabela"

# ── PostGIS: tamanho de índices espaciais GiST ────────────────────────────────
postgis_spatial_index_size:
  query: |
    SELECT n.nspname AS schema,
           i.relname AS index_name,
           pg_relation_size(i.oid) AS size_bytes
    FROM pg_class i
    JOIN pg_namespace n ON n.oid = i.relnamespace
    JOIN pg_index ix ON ix.indexrelid = i.oid
    JOIN pg_opclass op ON op.oid = ANY(ix.indclass)
    WHERE op.opcmethod = (SELECT oid FROM pg_am WHERE amname = 'gist')
      AND n.nspname NOT IN ('pg_catalog', 'information_schema')
    ORDER BY pg_relation_size(i.oid) DESC
  metrics:
    - schema:
        usage: LABEL
        description: "Schema do índice"
    - index_name:
        usage: LABEL
        description: "Nome do índice GiST espacial"
    - size_bytes:
        usage: GAUGE
        description: "Tamanho do índice espacial em bytes"

# ── Cache hit ratio por database ──────────────────────────────────────────────
pg_cache_hit_ratio:
  query: |
    SELECT datname,
           round(
             blks_hit::numeric / NULLIF(blks_hit + blks_read, 0) * 100, 2
           ) AS cache_hit_ratio_pct
    FROM pg_stat_database
    WHERE datname NOT IN ('template0', 'template1')
  metrics:
    - datname:
        usage: LABEL
        description: "Nome do database"
    - cache_hit_ratio_pct:
        usage: GAUGE
        description: "Percentual de blocos servidos do cache (alvo: > 95%)"

# ── Transações longas (abertas há mais de 10min) ──────────────────────────────
pg_long_running_transactions:
  query: |
    SELECT count(*) AS count
    FROM pg_stat_activity
    WHERE state IN ('active', 'idle in transaction')
      AND now() - xact_start > interval '10 minutes'
      AND xact_start IS NOT NULL
  metrics:
    - count:
        usage: GAUGE
        description: "Número de transações abertas há mais de 10 minutos"
