version: "3.8"

# projetinho-inf-postgres-exporter — Coolify-compatible Docker Compose
# Usa imagem oficial prometheuscommunity/postgres-exporter — sem build custom.
# Ver docker/README.md para o motivo.

services:
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      # DSN construído a partir das vars do .env
      # sslmode=require — conexão cifrada mesmo dentro da rede Docker
      DATA_SOURCE_NAME: "postgresql://metrics_reader:${DATA_SOURCE_PASS}@${PG_HOST:-postgres}:${PG_PORT:-5432}/postgres?sslmode=${PG_SSLMODE:-require}"

      # Arquivo de queries customizadas (montado via volume)
      PG_EXPORTER_EXTEND_QUERY_PATH: /conf/queries.yaml

      # Desabilita coleta de métricas padrão para determinadas categorias
      # que já estão cobertas pelas custom queries
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"

      PG_EXPORTER_LOG_LEVEL: "${LOG_LEVEL:-info}"

    volumes:
      - ./conf/queries.yaml:/conf/queries.yaml:ro

    networks:
      - coolify-network

    ports:
      # Porta interna apenas — Prometheus scrape via rede Docker.
      # NÃO exponha na internet.
      - "127.0.0.1:${METRICS_PORT:-9187}:9187"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M

networks:
  coolify-network:
    external: true
    name: coolify-network
